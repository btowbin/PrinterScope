<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="75mm" height="25mm" viewBox="0 0 75 25">
  <title>75 x 25 mm edge-lit microscope slide light guide</title>
  <desc>Red hairline: cut. Blue hairlines: engrave on the underside. LED couples into the left short edge.</desc>

  <!-- CUT: keep this outline as a vector/hairline cut. -->
  <g id="CUT" fill="none" stroke="#ff0000" stroke-width="0.02">
    <rect x="0.25" y="0.25" width="74.5" height="24.5" rx="0.6" ry="0.6"/>
  </g>

